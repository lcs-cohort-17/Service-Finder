name: PR Helper

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  check-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: Check PR completeness
        uses: actions/github-script@v7
        with:
          script: |
            console.log("🚀 PR Helper is running!");
            
            const prBody = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            
            console.log(`👤 Author: ${author}`);
            
            let isPO = false;
            
            try {
              const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
                org: 'lcs-cohort-17',
                team_slug: 'product-owners',
                username: author
              });
              isPO = membership.state === 'active';
              console.log(`✅ Is PO: ${isPO}`);
            } catch (error) {
              console.log(`❌ Not a PO: ${error.message}`);
              isPO = false;
            }
            
            if (isPO) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## 👋 Hey @${author}!\n\n**PO PR Detected.** No template needed! 🚀`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['release-pr']
              });
              
              return;
            }
            
            const issues = [];
            
            if (!prBody.includes('Developer')) {
              issues.push('- [ ] Add your Developer name');
            }
            if (!prBody.includes('Ticket')) {
              issues.push('- [ ] Add your Ticket number');
            }
            if (!prBody.includes('Summary')) {
              issues.push('- [ ] Add a Summary');
            }
            
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## 👋 Hey @${author}!\n\nPlease complete these items:\n${issues.join('\n')}`
              });
            }
